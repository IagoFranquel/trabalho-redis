<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Sistema de Vendas{% endblock %}</title>
<style>
  :root { --bg:#f5f6fa; --card:#fff; --txt:#1f2937; --mut:#6b7280; --pri:#2563eb; --ok:#16a34a; --err:#dc2626; --warn:#d97706; --bd:#e5e7eb; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--txt); }
  nav { background:#111827; padding:0 24px; display:flex; gap:4px; align-items:center; }
  nav .brand { color:#fff; font-weight:700; margin-right:24px; padding:16px 0; }
  nav a { color:#d1d5db; text-decoration:none; padding:16px 14px; font-size:14px; }
  nav a:hover, nav a.on { color:#fff; background:#1f2937; }
  main { max-width:1000px; margin:24px auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:10px; padding:20px; margin-bottom:20px; }
  h1 { font-size:22px; margin:0 0 4px; } h2 { font-size:16px; margin:0 0 12px; }
  .sub { color:var(--mut); font-size:13px; margin-bottom:16px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--bd); }
  th { color:var(--mut); font-weight:600; font-size:12px; text-transform:uppercase; }
  td.n, th.n { text-align:right; }
  .msg { padding:10px 14px; border-radius:8px; margin-bottom:16px; font-size:14px; }
  .msg.ok { background:#dcfce7; color:#166534; } .msg.erro { background:#fee2e2; color:#991b1b; }
  .tag { padding:2px 8px; border-radius:99px; font-size:12px; font-weight:600; }
  .t-OK, .t-CONCLUIDA, .t-REGULAR { background:#dcfce7; color:#166534; }
  .t-BAIXO { background:#fef3c7; color:#92400e; }
  .t-ESGOTADO, .t-CANCELADA { background:#fee2e2; color:#991b1b; }
  .t-VIP { background:#dbeafe; color:#1e40af; }
  input, select { padding:8px 10px; border:1px solid #d1d5db; border-radius:6px; font-size:14px; }
  button { background:var(--pri); color:#fff; border:0; padding:9px 16px; border-radius:6px; cursor:pointer; font-size:14px; }
  button.sec { background:#fff; color:var(--err); border:1px solid var(--err); padding:4px 10px; font-size:12px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .kpi { font-size:22px; font-weight:700; } .kpi small { display:block; font-size:12px; color:var(--mut); font-weight:400; }
  .form-row { display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
  .form-row label { font-size:12px; color:var(--mut); display:flex; flex-direction:column; gap:4px; }
  .src { font-size:12px; color:var(--mut); margin-top:10px; }
  code { background:#f3f4f6; padding:1px 5px; border-radius:4px; }
  .origem { padding:9px 14px; border-radius:8px; font-size:13px; margin-bottom:16px; border:1px solid var(--bd); background:#fff; }
  .origem.redis { background:#fef2f2; border-color:#fecaca; color:#991b1b; }
  .origem.supabase { background:#ecfdf5; border-color:#a7f3d0; color:#065f46; }
  .origem.sem-redis { background:#fffbeb; border-color:#fde68a; color:#92400e; }
</style>
</head>
<body>
<nav>
  <span class="brand">🛒 Sistema de Vendas</span>
  <a href="{{ url_for('relatorio_vendas') }}" class="{{ 'on' if request.endpoint=='relatorio_vendas' }}">Relatório de Vendas</a>
  <a href="{{ url_for('nova_venda') }}" class="{{ 'on' if request.endpoint=='nova_venda' }}">Nova Venda</a>
  <a href="{{ url_for('estoque') }}" class="{{ 'on' if request.endpoint=='estoque' }}">Estoque</a>
  <a href="{{ url_for('clientes') }}" class="{{ 'on' if request.endpoint=='clientes' }}">Clientes</a>
  <a href="{{ url_for('produtos') }}" class="{{ 'on' if request.endpoint=='produtos' }}">Produtos</a>
  <a href="{{ url_for('painel_redis') }}" class="{{ 'on' if request.endpoint=='painel_redis' }}">Painel Redis</a>
</nav>
<main>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}<div class="msg {{ cat }}">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
