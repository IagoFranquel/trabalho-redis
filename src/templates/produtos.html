{% extends "base.html" %}
{% block title %}Produtos{% endblock %}
{% block content %}
<h1>Produtos</h1>
<div class="sub">Cadastro de produtos (CRUD).</div>

<form method="post" class="card form-row">
  <label>Nome <input name="nome" required></label>
  <label>Preço <input name="preco" type="number" step="0.01" min="0.01" required style="width:110px"></label>
  <label>Estoque <input name="estoque" type="number" min="0" value="0" required style="width:90px"></label>
  <label>Estoque mínimo <input name="estoque_minimo" type="number" min="0" value="5" required style="width:90px"></label>
  <button>Cadastrar</button>
</form>

<div class="card">
  <table>
    <thead><tr><th>#</th><th>Nome</th><th class="n">Preço</th><th class="n">Estoque</th><th class="n">Mínimo</th></tr></thead>
    <tbody>
    {% for p in produtos %}
      <tr><td>{{ p.id }}</td><td>{{ p.nome }}</td><td class="n">{{ p.preco|brl }}</td>
          <td class="n">{{ p.estoque }}</td><td class="n">{{ p.estoque_minimo }}</td></tr>
    {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
